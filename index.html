<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foggy Glass – เป่าไอ แล้วเขียนด้วยนิ้ว</title>
<style>
  html, body { margin:0; height:100%; background:#0b1118; overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none;
    font-family:'Google Sans','Noto Sans Thai',system-ui,sans-serif; color:#eaf3ff; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  video#cam { position:fixed; width:2px; height:2px; opacity:0; pointer-events:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(11,17,24,.92); z-index:10; text-align:center; padding:24px; }
  #start h1 { margin:0; font-size:28px; font-weight:600; }
  #start p { margin:0; max-width:480px; line-height:1.6; opacity:.85; }
  button { font:inherit; color:#0b1118; background:#dff0ff; border:0; border-radius:999px;
    padding:10px 22px; cursor:pointer; }
  button.ghost { background:rgba(255,255,255,.14); color:#eaf3ff; padding:8px 16px; font-size:14px; }
  #hud { position:fixed; left:12px; right:12px; bottom:max(12px, env(safe-area-inset-bottom)); display:flex; flex-wrap:wrap; gap:10px;
    align-items:center; z-index:5; font-size:14px; }
  #hud .panel { background:rgba(8,14,22,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border-radius:14px; padding:8px 12px; display:flex; align-items:center; gap:8px; }
  .meter { width:70px; height:8px; background:rgba(255,255,255,.18); border-radius:4px; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:#8fd0ff; }
  #msg { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:5; font-size:15px;
    background:rgba(8,14,22,.55); padding:8px 16px; border-radius:999px; backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px); text-align:center; max-width:92vw; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="cam" playsinline muted></video>

<div id="start">
  <h1>🌫️ Foggy Glass</h1>
  <p>ทำปากจู๋เป่าลมใส่หน้าจอ กระจกจะเริ่มเป็นฝ้า<br>
  แล้วชูนิ้วชี้เขียนหรือวาดบนกระจก แบมือทั้งมือเพื่อเช็ดกว้าง ๆ</p>
  <button id="go">เริ่ม (อนุญาตกล้องและไมค์)</button>
  <p id="err" style="color:#ffb4a8"></p>
</div>

<div id="msg" style="display:none">กำลังโหลดโมเดล…</div>

<div id="hud" style="display:none">
  <div class="panel">ปาก <div class="meter" id="mMouth"><i></i></div></div>
  <div class="panel">ไมค์ <div class="meter" id="mMic"><i></i></div></div>
  <div class="panel">ความไวการเป่า
    <input id="sens" type="range" min="0" max="100" value="60"></div>
  <button class="ghost" id="fogAll">ทำฝ้าทั้งหมด</button>
  <button class="ghost" id="clear">เช็ดให้ใส</button>
  <button class="ghost" id="snap">บันทึกภาพ</button>
</div>

<script type="module">
import { HandLandmarker, FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = s => document.querySelector(s);
const view = $('#view'), vctx = view.getContext('2d');
const video = $('#cam');
const FS = 0.5;                       // ความละเอียดชั้นฝ้า (ครึ่งหนึ่งของจอ ให้เร็วขึ้น)
const fog = document.createElement('canvas'), fctx = fog.getContext('2d');
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
const small = document.createElement('canvas'), sctx = small.getContext('2d');
const grain = document.createElement('canvas'), gctx = grain.getContext('2d');
let W = 0, H = 0, fW = 0, fH = 0;

function makeGrain() {
  grain.width = 256; grain.height = 256;
  const id = gctx.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 200 + Math.random() * 55;
    id.data[i] = v; id.data[i + 1] = v + 4; id.data[i + 2] = 255; id.data[i + 3] = 40 + Math.random() * 50;
  }
  gctx.putImageData(id, 0, 0);
}
makeGrain();

function resize() {
  W = view.width = window.innerWidth;
  H = view.height = window.innerHeight;
  fW = fog.width = tmp.width = Math.max(64, Math.round(W * FS));
  fH = fog.height = tmp.height = Math.max(64, Math.round(H * FS));
  small.width = Math.max(10, Math.round(W / 55));      // เล็กมาก = เบลอแรง
  small.height = Math.max(10, Math.round(H / 55));
}
window.addEventListener('resize', resize);
resize();

// วาดวิดีโอแบบ cover + กลับซ้ายขวา (เหมือนกระจก)
function coverParams(w, h) {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(w / vw, h / vh);
  return { vw, vh, s, ox: (w - vw * s) / 2, oy: (h - vh * s) / 2 };
}
function drawVideo(ctx, w, h) {
  const { vw, vh, s, ox, oy } = coverParams(w, h);
  ctx.save();
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, ox, oy, vw * s, vh * s);
  ctx.restore();
}
function toScreen(lm) {
  const { vw, vh, s, ox, oy } = coverParams(W, H);
  return { x: W - (ox + lm.x * vw * s), y: oy + lm.y * vh * s };
}

// ---------- เสียง ----------
let analyser, audioBuf, baseline = 0.01, baseFrames = 0, spaceDown = false;
async function setupAudio(stream) {
  if (!stream.getAudioTracks().length) return;
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') await ac.resume();
  const src = ac.createMediaStreamSource(stream);
  analyser = ac.createAnalyser(); analyser.fftSize = 1024;
  src.connect(analyser);
  audioBuf = new Float32Array(analyser.fftSize);
}
function readMic(sens) {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(audioBuf);
  let sum = 0; for (const v of audioBuf) sum += v * v;
  const rms = Math.sqrt(sum / audioBuf.length);
  if (baseFrames < 60) { baseline = Math.max(baseline * 0.9 + rms * 0.1, 0.002); baseFrames++; return 0; }
  const thr = baseline * (6 - sens * 4.2) + 0.004;
  $('#mMic i').style.width = Math.min(100, rms / (thr * 2) * 100) + '%';
  return Math.max(0, Math.min(1, (rms - thr) / (thr * 1.5)));
}

// ---------- โมเดล ----------
let hands = null, face = null, lastHandT = -1, lastFaceT = -1;
let handInfo = null, mouth = null, mouthScore = 0, pen = null;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function analyzeHand(lm) {
  const ext = (tip, pip) => dist(lm[tip], lm[0]) > dist(lm[pip], lm[0]) * 1.05;
  const idx = ext(8, 6), mid = ext(12, 10), ring = ext(16, 14), pky = ext(20, 18);
  if (idx && mid && ring && pky) return { mode: 'palm', p: toScreen(lm[9]) };
  if (idx && !mid) return { mode: 'write', p: toScreen(lm[8]) };
  return { mode: 'none' };
}

function readFace(res) {
  if (!res.faceLandmarks || !res.faceLandmarks[0]) { mouth = null; mouthScore = 0; return; }
  const lm = res.faceLandmarks[0];
  mouth = toScreen({ x: (lm[13].x + lm[14].x) / 2, y: (lm[13].y + lm[14].y) / 2 });
  const bs = {};
  const cats = res.faceBlendshapes && res.faceBlendshapes[0] ? res.faceBlendshapes[0].categories : [];
  for (const c of cats) bs[c.categoryName] = c.score;
  // ท่าเป่า: ปากจู๋ / ปากกลมเป็นรู / แก้มป่อง
  mouthScore = Math.max(bs.mouthPucker || 0, (bs.mouthFunnel || 0) * 0.95, (bs.cheekPuff || 0) * 1.1);
}

// ---------- ฝ้า ----------
function stamp(x, y, r, strength) {
  const g = fctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${strength})`);
  g.addColorStop(0.6, `rgba(0,0,0,${strength * 0.7})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  fctx.fillStyle = g;
  fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
}
function wipeLine(a, b, r, strength) {
  const d = Math.max(1, dist(a, b));
  const step = Math.max(2, r * 0.3);
  for (let t = 0; t <= d; t += step) {
    const k = t / d;
    stamp((a.x + (b.x - a.x) * k) * FS, (a.y + (b.y - a.y) * k) * FS, r * FS, strength);
  }
}
function puff(x, y, level) {
  const r = H * 0.6 * FS;
  const g = fctx.createRadialGradient(x * FS, y * FS, 0, x * FS, y * FS, r);
  g.addColorStop(0, `rgba(232,242,255,${0.16 * level})`);
  g.addColorStop(1, 'rgba(232,242,255,0)');
  fctx.fillStyle = g;
  fctx.fillRect(0, 0, fW, fH);
}

// ---------- ลูปหลัก ----------
let frame = 0, blow = 0;
function loop() {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  frame++;
  const now = performance.now();
  const sens = +$('#sens').value / 100;

  // มือ: ทุกเฟรมที่มีภาพใหม่
  if (hands && video.currentTime !== lastHandT) {
    lastHandT = video.currentTime;
    try {
      const res = hands.detectForVideo(video, now);
      handInfo = res.landmarks && res.landmarks[0] ? analyzeHand(res.landmarks[0]) : null;
    } catch (e) { /* ข้ามเฟรม */ }
  }
  // หน้า: ทุก 3 เฟรม (ท่าปากเปลี่ยนไม่เร็ว)
  if (face && frame % 3 === 0 && video.currentTime !== lastFaceT) {
    lastFaceT = video.currentTime;
    try { readFace(face.detectForVideo(video, now + 0.01)); } catch (e) { /* ข้ามเฟรม */ }
  }

  // ระดับการเป่า = ท่าปาก + เสียงลม + Space
  const thr = 0.55 - sens * 0.4;                         // ความไว 60% → ~0.31
  const faceBlow = Math.max(0, Math.min(1, (mouthScore - thr) / 0.25));
  $('#mMouth i').style.width = Math.min(100, mouthScore / Math.max(0.05, thr * 2) * 100) + '%';
  const micBlow = readMic(sens);
  const target = spaceDown ? 1 : Math.max(faceBlow, micBlow);
  blow = blow * 0.7 + target * 0.3;

  if (blow > 0.08) {
    fctx.globalCompositeOperation = 'source-over';
    if (mouth) puff(mouth.x, mouth.y, blow);
    fctx.fillStyle = `rgba(232,242,255,${0.035 * blow})`;   // ฝ้าบาง ๆ ทั่วกระจก
    fctx.fillRect(0, 0, fW, fH);
  }
  if (frame % 8 === 0) {                                    // ฝ้าค่อย ๆ จางเอง
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0,0,0,0.006)';
    fctx.fillRect(0, 0, fW, fH);
  }

  // เขียน / เช็ด
  fctx.globalCompositeOperation = 'destination-out';
  if (handInfo && handInfo.mode !== 'none') {
    const t = handInfo.p;
    const sm = pen ? { x: pen.x + (t.x - pen.x) * 0.8, y: pen.y + (t.y - pen.y) * 0.8 } : t;
    if (handInfo.mode === 'write') wipeLine(pen || sm, sm, Math.max(14, W / 70), 1);
    else wipeLine(pen || sm, sm, Math.max(60, W / 14), 0.6);
    pen = sm;
  } else pen = null;
  fctx.globalCompositeOperation = 'source-over';

  // ประกอบภาพ: วิดีโอคมชัด + ชั้นฝ้า (เบลอแรง + ขาวขุ่น + เกรน) ที่ถูกมาสก์ด้วยฝ้า
  drawVideo(vctx, W, H);
  tctx.globalCompositeOperation = 'source-over';
  tctx.clearRect(0, 0, fW, fH);
  drawVideo(sctx, small.width, small.height);
  tctx.imageSmoothingEnabled = true;
  tctx.drawImage(small, 0, 0, fW, fH);
  tctx.fillStyle = 'rgba(236,244,255,0.62)';
  tctx.fillRect(0, 0, fW, fH);
  tctx.fillStyle = tctx.createPattern(grain, 'repeat');
  tctx.fillRect(0, 0, fW, fH);
  tctx.globalCompositeOperation = 'destination-in';
  tctx.drawImage(fog, 0, 0);
  vctx.drawImage(tmp, 0, 0, W, H);

  // เคอร์เซอร์
  if (handInfo && handInfo.mode !== 'none') {
    vctx.strokeStyle = 'rgba(255,255,255,.85)'; vctx.lineWidth = 2;
    vctx.beginPath();
    vctx.arc(handInfo.p.x, handInfo.p.y, handInfo.mode === 'write' ? Math.max(14, W / 70) : Math.max(60, W / 14), 0, Math.PI * 2);
    vctx.stroke();
  }
}

// ---------- เริ่มต้น ----------
async function makeModels() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mk = async (Cls, url, extra) => {
    for (const delegate of ["GPU", "CPU"]) {
      try {
        return await Cls.createFromOptions(fileset, { baseOptions: { modelAssetPath: url, delegate }, runningMode: "VIDEO", ...extra });
      } catch (e) { console.warn(Cls.name, delegate, e); }
    }
    return null;
  };
  hands = await mk(HandLandmarker, "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", { numHands: 1 });
  $('#msg').textContent = 'โหลดโมเดลมือแล้ว กำลังโหลดโมเดลใบหน้า…';
  face = await mk(FaceLandmarker, "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", { numFaces: 1, outputFaceBlendshapes: true });
}

$('#go').onclick = async () => {
  $('#err').textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } }));
    video.srcObject = stream;
    await video.play();
    await setupAudio(stream).catch(console.warn);
    $('#start').style.display = 'none';
    $('#hud').style.display = 'flex';
    $('#msg').style.display = 'block';
    loop();
    await makeModels();
    $('#msg').textContent = 'ทำปากจู๋เป่า → ฝ้าขึ้น • ชูนิ้วชี้เพื่อเขียน • แบมือเพื่อเช็ด';
    setTimeout(() => $('#msg').style.display = 'none', 7000);
  } catch (e) {
    $('#start').style.display = 'flex';
    $('#err').textContent = 'เริ่มไม่ได้: ' + e.message + ' (ต้องเปิดผ่าน https และอนุญาตกล้อง/ไมค์)';
    console.error(e);
  }
};

addEventListener('keydown', e => { if (e.code === 'Space') { spaceDown = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });
$('#fogAll').onclick = () => { fctx.globalCompositeOperation = 'source-over'; fctx.fillStyle = 'rgba(232,242,255,0.9)'; fctx.fillRect(0, 0, fW, fH); };
$('#clear').onclick = () => { fctx.clearRect(0, 0, fW, fH); };
$('#snap').onclick = () => { const a = document.createElement('a'); a.download = 'foggy-glass.png'; a.href = view.toDataURL('image/png'); a.click(); };
</script>
</body>
</html>
