<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foggy Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f4f8ff; --muted:rgba(244,248,255,.62); --glass:rgba(10,16,24,.42); --line:rgba(255,255,255,.16); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#0b1118; overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    font-family:'Poppins',system-ui,-apple-system,sans-serif; color:var(--ink); }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  video#cam { position:fixed; width:2px; height:2px; opacity:0; pointer-events:none; }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:rgba(8,13,20,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    z-index:10; text-align:center; padding:24px; }
  #start .logo { width:56px; height:56px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; }
  #start .logo svg { width:26px; height:26px; }
  #start h1 { margin:0; font-size:26px; font-weight:500; letter-spacing:.2px; }
  #start p { margin:0; max-width:340px; font-size:14px; font-weight:300; line-height:1.7; color:var(--muted); }
  #go { font:inherit; font-size:14px; font-weight:500; color:#0b1118; background:var(--ink); border:0;
    border-radius:999px; padding:12px 28px; cursor:pointer; }
  #err { color:#ffb4a8 !important; font-size:12px !important; }

  #hud { position:fixed; left:50%; transform:translateX(-50%); bottom:max(16px, env(safe-area-inset-bottom));
    display:flex; flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 24px); align-items:center; gap:2px 6px; z-index:5; padding:6px; border-radius:26px;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .chip { display:flex; align-items:center; gap:8px; padding:0 12px; height:40px; color:var(--muted); }
  .chip .meter { width:46px; height:3px; background:rgba(255,255,255,.18); border-radius:3px; overflow:hidden; }
  .chip .meter i { display:block; height:100%; width:0; background:var(--ink); }
  .sep { width:1px; height:20px; background:var(--line); margin:0 2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:84px; height:3px; border-radius:3px;
    background:rgba(255,255,255,.22); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--ink); border:0; }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:var(--ink); border:0; }
  .btn { width:40px; height:40px; border-radius:50%; border:0; background:transparent; color:var(--ink);
    display:grid; place-items:center; cursor:pointer; }
  .btn:active { background:rgba(255,255,255,.14); }

  #msg { position:fixed; top:max(18px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:5;
    font-size:13px; font-weight:400; letter-spacing:.1px; padding:9px 18px; border-radius:999px; white-space:nowrap;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  @media (max-width:720px){ #msg{ white-space:normal; text-align:center; width:88vw; border-radius:18px; } .chip .meter{width:30px} input[type=range]{width:64px} }
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="cam" playsinline muted></video>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-eraser"viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  </defs>
</svg>

<div id="start">
  <div class="logo"><svg class="i"><use href="#i-wind"/></svg></div>
  <h1>Foggy Glass</h1>
  <p>Breathe on the screen to fog the glass, then write or draw with your finger.</p>
  <button id="go">Start</button>
  <p id="err"></p>
</div>

<div id="msg" style="display:none">Loading models…</div>

<div id="hud" style="display:none">
  <div class="chip" title="Breath"><svg class="i"><use href="#i-wind"/></svg><div class="meter" id="mMouth"><i></i></div></div>
  <div class="chip" title="Mouth sensitivity"><svg class="i"><use href="#i-sliders"/></svg><input id="sens" type="range" min="0" max="100" value="70"></div>
  <div class="chip" title="Fog size"><svg class="i"><use href="#i-expand"/></svg><input id="fogW" type="range" min="0" max="100" value="33"></div>
  <div class="chip" title="Pen width"><svg class="i"><use href="#i-pen"/></svg><input id="penW" type="range" min="0" max="100" value="15"></div>
  <div class="sep"></div>
  <button class="btn" id="recal" title="Recalibrate mouth"><svg class="i"><use href="#i-refresh"/></svg></button>
  <button class="btn" id="fogAll" title="Fog everything"><svg class="i"><use href="#i-cloud"/></svg></button>
  <button class="btn" id="clear" title="Clear glass"><svg class="i"><use href="#i-eraser"/></svg></button>
  <button class="btn" id="snap" title="Save image"><svg class="i"><use href="#i-download"/></svg></button>
</div>

<script type="module">
import { HandLandmarker, FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = s => document.querySelector(s);
const view = $('#view'), vctx = view.getContext('2d');
const video = $('#cam');
const FS = 0.5;
const fog = document.createElement('canvas'), fctx = fog.getContext('2d');
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
const small = document.createElement('canvas'), sctx = small.getContext('2d');
const grain = document.createElement('canvas'), gctx = grain.getContext('2d');
let W = 0, H = 0, fW = 0, fH = 0;

(function makeGrain() {
  grain.width = 256; grain.height = 256;
  const id = gctx.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 205 + Math.random() * 50;
    id.data[i] = v; id.data[i + 1] = v + 4; id.data[i + 2] = 255; id.data[i + 3] = 35 + Math.random() * 45;
  }
  gctx.putImageData(id, 0, 0);
})();

function resize() {
  W = view.width = window.innerWidth;
  H = view.height = window.innerHeight;
  fW = fog.width = tmp.width = Math.max(64, Math.round(W * FS));
  fH = fog.height = tmp.height = Math.max(64, Math.round(H * FS));
  small.width = Math.max(10, Math.round(W / 55));
  small.height = Math.max(10, Math.round(H / 55));
}
window.addEventListener('resize', resize);
resize();

function coverParams(w, h) {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(w / vw, h / vh);
  return { vw, vh, s, ox: (w - vw * s) / 2, oy: (h - vh * s) / 2 };
}
function drawVideo(ctx, w, h) {
  const { vw, vh, s, ox, oy } = coverParams(w, h);
  ctx.save();
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, ox, oy, vw * s, vh * s);
  ctx.restore();
}
function toScreen(lm) {
  const { vw, vh, s, ox, oy } = coverParams(W, H);
  return { x: W - (ox + lm.x * vw * s), y: oy + lm.y * vh * s };
}

// ---------- models ----------
let hands = null, face = null, lastHandT = -1, lastFaceT = -1;
let handInfo = null, mouth = null, pen = null, penLost = 0;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// Hand pose from finger-extension ratios (fingertip-to-wrist / knuckle-to-wrist).
// Extended finger ≈ 1.8–2.0, curled finger ≈ 1.0–1.3, so the gap is wide and stable.
let prevRI = 0;
function analyzeHand(lm) {
  const r = (tip, mcp) => dist(lm[tip], lm[0]) / (dist(lm[mcp], lm[0]) || 1);
  const rI = r(8, 5), rM = r(12, 9), rR = r(16, 13), rP = r(20, 17);
  const curling = prevRI > 0 && rI < prevRI - 0.15;       // index is folding right now → stop early
  prevRI = rI;
  if (rI > 1.5 && rM > 1.5 && rR > 1.45 && rP > 1.35) return { mode: 'palm', p: toScreen(lm[9]) };
  if (rI > 1.45 && rM < 1.55 && !curling) return { mode: 'write', p: toScreen(lm[8]) };
  return { mode: 'none' };
}

// ---- mouth: geometry relative to YOUR neutral face (calibrated at start) ----
let openR = 0, widthR = 0, scoreS = 0, calibrated = false;
const calib = { active: false, n: 0, open: 0, width: 0 };
const neutral = { open: 0, width: 0.3 };
function startCalibration() {
  calibrated = false; scoreS = 0;
  calib.active = true; calib.n = 0; calib.open = 0; calib.width = 0;
  $('#msg').style.display = 'block';
  $('#msg').textContent = 'Relax your face with a closed mouth for a moment…';
}
function readFace(res) {
  if (!res.faceLandmarks || !res.faceLandmarks[0]) { mouth = null; return; }
  const lm = res.faceLandmarks[0];
  mouth = toScreen({ x: (lm[13].x + lm[14].x) / 2, y: (lm[13].y + lm[14].y) / 2 });
  const fw = dist(lm[234], lm[454]) || 1;                 // face width (cheek to cheek)
  openR = dist(lm[13], lm[14]) / fw;                      // inner-lip gap
  widthR = dist(lm[61], lm[291]) / fw;                    // mouth-corner width
  if (calib.active) {
    calib.open += openR; calib.width += widthR; calib.n++;
    if (calib.n >= 30) {
      neutral.open = calib.open / calib.n; neutral.width = calib.width / calib.n;
      calib.active = false; calibrated = true;
      $('#msg').textContent = 'Ready · open your mouth or purse your lips to fog the glass';
      setTimeout(() => $('#msg').style.display = 'none', 4000);
    }
  }
}

// ---------- fog ----------
function stamp(x, y, r, strength) {
  const g = fctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${strength})`);
  g.addColorStop(0.6, `rgba(0,0,0,${strength * 0.7})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  fctx.fillStyle = g;
  fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
}
function wipeLine(a, b, r, strength) {
  const d = Math.max(1, dist(a, b));
  const step = Math.max(2, r * 0.3);
  for (let t = 0; t <= d; t += step) {
    const k = t / d;
    stamp((a.x + (b.x - a.x) * k) * FS, (a.y + (b.y - a.y) * k) * FS, r * FS, strength);
  }
}
// soft, local breath cloud: a few jittered blobs with a long smooth falloff
let breath = 0;                                    // grows while breathing, relaxes after
function puff(x, y, level) {
  const base = H * (0.09 + 0.12 * breath) * FS * fogK();
  for (let i = 0; i < 3; i++) {
    const r = base * (0.8 + Math.random() * 0.5);
    const cx = x * FS + (Math.random() - 0.5) * base * 0.5;
    const cy = y * FS + (Math.random() - 0.5) * base * 0.4;
    const a = 0.05 * level;
    const g = fctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(238,245,255,${a})`);
    g.addColorStop(0.35, `rgba(238,245,255,${a * 0.7})`);
    g.addColorStop(0.7, `rgba(238,245,255,${a * 0.25})`);
    g.addColorStop(1, 'rgba(238,245,255,0)');
    fctx.fillStyle = g;
    fctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
}

// ---------- main loop ----------
let frame = 0, blow = 0, mouthOn = false;
const sensEl = $('#sens'), meterEl = $('#mMouth i'), penEl = $('#penW'), fogEl = $('#fogW');
let grainPat = null;
const pts = [];                                       // confirmed pen points waiting to be drawn
let lastMid = null;
const penR = () => 6 + (+penEl.value) * 0.6;          // pen radius in px
const fogK = () => 0.5 + (+fogEl.value) / 100 * 1.5;  // breath cloud size multiplier
// Draw a smooth quadratic curve through midpoints (a→b→c), so lines are continuous even
// when the camera only delivers ~15 hand positions per second.
function drawCurve(a, b, c) {
  const m1 = lastMid || a, m2 = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2 };
  const write = b.mode === 'write';
  const r = write ? penR() : Math.max(60, W / 14), st = write ? 1 : 0.6;
  const n = Math.max(1, Math.ceil((dist(m1, b) + dist(b, m2)) / Math.max(2, r * 0.3)));
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    stamp((u * u * m1.x + 2 * u * t * b.x + t * t * m2.x) * FS,
          (u * u * m1.y + 2 * u * t * b.y + t * t * m2.y) * FS, r * FS, st);
  }
  lastMid = m2;
}
function loop() {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  frame++;
  const now = performance.now();
  const sens = +sensEl.value / 100;

  if (hands && video.currentTime !== lastHandT) {
    lastHandT = video.currentTime;
    try {
      const res = hands.detectForVideo(video, now);
      if (res.landmarks && res.landmarks[0]) handInfo = analyzeHand(res.landmarks[0]);
      else { handInfo = null; prevRI = 0; }
    } catch (e) {}
  }
  // Hands get priority: skip face tracking while writing, so finger tracking stays fast.
  const handBusy = handInfo && handInfo.mode === 'write';
  if (face && !handBusy && frame % 2 === 0 && video.currentTime !== lastFaceT) {
    lastFaceT = video.currentTime;
    try { readFace(face.detectForVideo(video, now + 0.01)); } catch (e) {}
  }

  // Score 1.0 = threshold. Open mouth: lip gap grows past neutral. Pursed: mouth width shrinks below neutral.
  let score = 0;
  if (calibrated && mouth) {
    const dOpen = 0.07 - sens * 0.05;                   // slider 70% → 0.035 of face width
    const shrink = 0.22 - sens * 0.12;                  // slider 70% → mouth 14% narrower
    score = Math.max(0, (openR - neutral.open) / dOpen, (neutral.width - widthR) / (neutral.width * shrink));
  }
  scoreS = scoreS * 0.5 + score * 0.5;
  if (!mouth || !calibrated || handBusy) mouthOn = false;
  else if (!mouthOn && scoreS >= 1) mouthOn = true;      // on at threshold
  else if (mouthOn && scoreS < 0.7) mouthOn = false;     // hysteresis: off a bit lower
  meterEl.style.width = Math.min(100, scoreS / 1.5 * 100) + '%';
  const target = mouthOn ? Math.min(1, (scoreS - 0.7) / 0.8) : 0;
  blow = blow * 0.75 + target * 0.25;
  breath = mouthOn ? Math.min(1, breath + 0.012) : Math.max(0, breath - 0.03);

  fctx.globalCompositeOperation = 'source-over';
  if (mouth && mouthOn && blow > 0.05) puff(mouth.x, mouth.y, blow);
  if (frame % 8 === 0) {                           // slow evaporation
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0,0,0,0.006)';
    fctx.fillRect(0, 0, fW, fH);
  }

  fctx.globalCompositeOperation = 'destination-out';
  if (handInfo && handInfo.mode !== 'none') {
    const t = handInfo.p;
    penLost = 0;
    // adaptive smoothing: steady when slow, almost raw when fast
    const speed = pen ? dist(t, pen) : 0;
    const a = Math.min(1, 0.55 + speed / 30);
    const sm = pen ? { x: pen.x + (t.x - pen.x) * a, y: pen.y + (t.y - pen.y) * a } : t;
    pts.push({ x: sm.x, y: sm.y, mode: handInfo.mode });
    pen = sm;
    // 2-point delay: the moment the finger folds is never drawn (no tail after you stop)
    while (pts.length >= 3) { drawCurve(pts[0], pts[1], pts[2]); pts.shift(); }
  } else if (++penLost > 2) {                          // 1-2 frame dropouts keep the line going
    pts.length = 0; pen = null; lastMid = null;        // real stop: drop unconfirmed points, end stroke
  }
  fctx.globalCompositeOperation = 'source-over';

  drawVideo(vctx, W, H);
  tctx.globalCompositeOperation = 'source-over';
  tctx.clearRect(0, 0, fW, fH);
  drawVideo(sctx, small.width, small.height);
  tctx.imageSmoothingEnabled = true;
  tctx.drawImage(small, 0, 0, fW, fH);
  tctx.fillStyle = 'rgba(236,244,255,0.62)';
  tctx.fillRect(0, 0, fW, fH);
  if (!grainPat) grainPat = tctx.createPattern(grain, 'repeat');
  tctx.fillStyle = grainPat;
  tctx.fillRect(0, 0, fW, fH);
  tctx.globalCompositeOperation = 'destination-in';
  tctx.drawImage(fog, 0, 0);
  vctx.drawImage(tmp, 0, 0, W, H);

  if (handInfo && handInfo.mode !== 'none') {
    vctx.strokeStyle = 'rgba(255,255,255,.8)'; vctx.lineWidth = 1.5;
    vctx.beginPath();
    vctx.arc(handInfo.p.x, handInfo.p.y, handInfo.mode === 'write' ? penR() : Math.max(60, W / 14), 0, Math.PI * 2);
    vctx.stroke();
  }
}

// ---------- start ----------
async function makeModels() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mk = async (Cls, url, extra) => {
    for (const delegate of ["GPU", "CPU"]) {
      try {
        return await Cls.createFromOptions(fileset, { baseOptions: { modelAssetPath: url, delegate }, runningMode: "VIDEO", ...extra });
      } catch (e) { console.warn(Cls.name, delegate, e); }
    }
    return null;
  };
  hands = await mk(HandLandmarker, "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", { numHands: 1, minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4 });
  $('#msg').textContent = 'Hand tracking ready · loading face tracking…';
  face = await mk(FaceLandmarker, "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", { numFaces: 1, outputFaceBlendshapes: false });
}

$('#go').onclick = async () => {
  $('#err').textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    $('#start').style.display = 'none';
    $('#hud').style.display = 'flex';
    $('#msg').style.display = 'block';
    loop();
    await makeModels();
    startCalibration();
  } catch (e) {
    $('#start').style.display = 'flex';
    $('#err').textContent = 'Could not start: ' + e.message + ' (needs https and camera access)';
    console.error(e);
  }
};

$('#recal').onclick = startCalibration;
$('#fogAll').onclick = () => { fctx.globalCompositeOperation = 'source-over'; fctx.fillStyle = 'rgba(238,245,255,0.9)'; fctx.fillRect(0, 0, fW, fH); };
$('#clear').onclick = () => { fctx.clearRect(0, 0, fW, fH); };
$('#snap').onclick = () => { const a = document.createElement('a'); a.download = 'foggy-glass.png'; a.href = view.toDataURL('image/png'); a.click(); };
</script>
</body>
</html>
