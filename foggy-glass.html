<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foggy Glass – เป่าไอ แล้วเขียนด้วยนิ้ว</title>
<style>
  html, body { margin:0; height:100%; touch-action:none; -webkit-user-select:none; user-select:none; background:#0b1118; overflow:hidden;
    font-family:'Google Sans','Noto Sans Thai',system-ui,sans-serif; color:#eaf3ff; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  video#cam { display:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(11,17,24,.92); z-index:10; text-align:center; padding:24px; }
  #start h1 { margin:0; font-size:28px; font-weight:600; }
  #start p { margin:0; max-width:460px; line-height:1.6; opacity:.85; }
  button { font:inherit; color:#0b1118; background:#dff0ff; border:0; border-radius:999px;
    padding:10px 22px; cursor:pointer; }
  button.ghost { background:rgba(255,255,255,.14); color:#eaf3ff; padding:8px 16px; font-size:14px; }
  #hud { position:fixed; left:12px; right:12px; bottom:12px; display:flex; flex-wrap:wrap; gap:10px;
    align-items:center; z-index:5; font-size:14px; }
  #hud .panel { background:rgba(8,14,22,.55); backdrop-filter:blur(6px); border-radius:14px;
    padding:8px 12px; display:flex; align-items:center; gap:8px; }
  #meter { width:90px; height:8px; background:rgba(255,255,255,.18); border-radius:4px; overflow:hidden; }
  #meter i { display:block; height:100%; width:0; background:#8fd0ff; }
  #msg { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:5; font-size:15px;
    background:rgba(8,14,22,.55); padding:8px 16px; border-radius:999px; backdrop-filter:blur(6px); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="cam" playsinline muted></video>

<div id="start">
  <h1>🌫️ Foggy Glass</h1>
  <p>เป่าลมใส่ไมโครโฟนให้กระจกเป็นฝ้า แล้วใช้นิ้วชี้เขียนหรือวาดบนกระจก<br>
  แบมือทั้งมือเพื่อเช็ดทีเดียวเป็นพื้นที่กว้าง</p>
  <button id="go">เริ่ม (อนุญาตกล้องและไมค์)</button>
  <p id="err" style="color:#ffb4a8"></p>
</div>

<div id="msg" style="display:none">กำลังโหลดโมเดลตรวจจับมือ…</div>

<div id="hud" style="display:none">
  <div class="panel">ไมค์ <div id="meter"><i></i></div></div>
  <div class="panel">ความไวการเป่า
    <input id="sens" type="range" min="0" max="100" value="55"></div>
  <button class="ghost" id="blowBtn" style="touch-action:none;user-select:none;-webkit-user-select:none">💨 กดค้างเพื่อเป่า</button>
  <button class="ghost" id="fogAll">ทำให้เป็นฝ้าทั้งหมด</button>
  <button class="ghost" id="clear">เช็ดให้ใส</button>
  <button class="ghost" id="snap">บันทึกภาพ</button>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = s => document.querySelector(s);
const view = $('#view'), vctx = view.getContext('2d');
const video = $('#cam');
const fog = document.createElement('canvas'), fctx = fog.getContext('2d');
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
const small = document.createElement('canvas'), sctx = small.getContext('2d');
let W = 0, H = 0;

function resize() {
  W = view.width = fog.width = tmp.width = window.innerWidth;
  H = view.height = fog.height = tmp.height = window.innerHeight;
  small.width = Math.max(16, Math.round(W / 22));
  small.height = Math.max(16, Math.round(H / 22));
}
window.addEventListener('resize', resize);
resize();

// วาดวิดีโอแบบ cover + กลับซ้ายขวา (เหมือนกระจก)
function coverParams(w, h) {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(w / vw, h / vh);
  return { vw, vh, s, ox: (w - vw * s) / 2, oy: (h - vh * s) / 2 };
}
function drawVideo(ctx, w, h) {
  const { vw, vh, s, ox, oy } = coverParams(w, h);
  ctx.save();
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, ox, oy, vw * s, vh * s);
  ctx.restore();
}
// แปลงพิกัด landmark (0-1) เป็นพิกัดหน้าจอ
function toScreen(lm) {
  const { vw, vh, s, ox, oy } = coverParams(W, H);
  return { x: W - (ox + lm.x * vw * s), y: oy + lm.y * vh * s };
}

// ---------- เสียง (ตรวจจับการเป่า) ----------
let analyser, audioBuf, baseline = 0.01, baseFrames = 0, blowLevel = 0, spaceDown = false;
async function setupAudio(stream) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const src = ac.createMediaStreamSource(stream);
  if (ac.state === 'suspended') await ac.resume();   // Safari/iPad ต้อง resume เอง
  analyser = ac.createAnalyser(); analyser.fftSize = 1024;
  src.connect(analyser);
  audioBuf = new Float32Array(analyser.fftSize);
}
function readBlow() {
  if (spaceDown) return 1;
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(audioBuf);
  let sum = 0; for (const v of audioBuf) sum += v * v;
  const rms = Math.sqrt(sum / audioBuf.length);
  if (baseFrames < 60) { baseline = Math.max(baseline * 0.9 + rms * 0.1, 0.002); baseFrames++; return 0; }
  const sens = +$('#sens').value / 100;           // 0..1
  const mult = 6 - sens * 4.2;                    // ไวสุด ~1.8x, ไม่ไวสุด 6x
  const thr = baseline * mult + 0.004;
  const x = (rms - thr) / (thr * 1.5);
  $('#meter i').style.width = Math.min(100, rms / (thr * 2) * 100) + '%';
  return Math.max(0, Math.min(1, x));
}

// ---------- มือ ----------
let hands, lastVideoTime = -1, pen = null, handInfo = null;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function analyzeHand(lm) {
  const ext = (tip, pip) => dist(lm[tip], lm[0]) > dist(lm[pip], lm[0]) * 1.08;
  const idx = ext(8, 6), mid = ext(12, 10), ring = ext(16, 14), pky = ext(20, 18);
  if (idx && !mid && !ring) return { mode: 'write', p: toScreen(lm[8]) };
  if (idx && mid && ring && pky) return { mode: 'palm', p: toScreen(lm[9]) };
  return { mode: 'none' };
}

function stamp(x, y, r, strength) {
  const g = fctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${strength})`);
  g.addColorStop(0.6, `rgba(0,0,0,${strength * 0.7})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  fctx.fillStyle = g;
  fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
}
function wipeLine(a, b, r, strength) {
  const d = Math.max(1, dist(a, b));
  const step = Math.max(2, r * 0.25);
  for (let t = 0; t <= d; t += step) {
    const k = t / d;
    stamp(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, r, strength);
  }
}

// ---------- ลูปหลัก ----------
let frame = 0, fogLevelStart = 0;
function loop() {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  frame++;

  // ตรวจจับมือ
  if (hands && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = hands.detectForVideo(video, performance.now());
    handInfo = res.landmarks && res.landmarks[0] ? analyzeHand(res.landmarks[0]) : null;
  }

  // เป่า -> เพิ่มฝ้า
  blowLevel = blowLevel * 0.8 + readBlow() * 0.2;
  if (blowLevel > 0.05) {
    fctx.globalCompositeOperation = 'source-over';
    fctx.fillStyle = `rgba(228,240,252,${0.045 * blowLevel})`;
    fctx.fillRect(0, 0, W, H);
  }
  // ฝ้าค่อย ๆ จางเอง (ทุก 6 เฟรม เพื่อไม่ให้ติดข้อจำกัดความละเอียดสี)
  if (frame % 6 === 0) {
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0,0,0,0.006)';
    fctx.fillRect(0, 0, W, H);
  }

  // นิ้วเขียน / ฝ่ามือเช็ด
  fctx.globalCompositeOperation = 'destination-out';
  if (handInfo && handInfo.mode !== 'none') {
    const target = handInfo.p;
    const smooth = pen ? { x: pen.x + (target.x - pen.x) * 0.5, y: pen.y + (target.y - pen.y) * 0.5 } : target;
    if (handInfo.mode === 'write') wipeLine(pen || smooth, smooth, Math.max(14, W / 70), 0.9);
    else wipeLine(pen || smooth, smooth, Math.max(60, W / 14), 0.5);
    pen = smooth;
  } else pen = null;
  fctx.globalCompositeOperation = 'source-over';

  // ประกอบภาพ: วิดีโอคมชัด + ชั้นเบลอที่ถูกมาสก์ด้วยฝ้า
  drawVideo(vctx, W, H);
  tctx.globalCompositeOperation = 'source-over';
  tctx.clearRect(0, 0, W, H);
  drawVideo(sctx, small.width, small.height);
  tctx.imageSmoothingEnabled = true;
  tctx.drawImage(small, 0, 0, W, H);
  tctx.fillStyle = 'rgba(225,238,252,0.38)';
  tctx.fillRect(0, 0, W, H);
  tctx.globalCompositeOperation = 'destination-in';
  tctx.drawImage(fog, 0, 0);
  vctx.drawImage(tmp, 0, 0);

  // เคอร์เซอร์บอกตำแหน่งนิ้ว
  if (handInfo && handInfo.mode !== 'none') {
    vctx.strokeStyle = 'rgba(255,255,255,.8)'; vctx.lineWidth = 2;
    vctx.beginPath();
    vctx.arc(handInfo.p.x, handInfo.p.y, handInfo.mode === 'write' ? Math.max(14, W / 70) : Math.max(60, W / 14), 0, Math.PI * 2);
    vctx.stroke();
  }
}

// ---------- เริ่มต้น ----------
$('#go').onclick = async () => {
  $('#err').textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    video.srcObject = stream;
    await video.play();
    await setupAudio(stream);
    $('#start').style.display = 'none';
    $('#hud').style.display = 'flex';
    $('#msg').style.display = 'block';
    fctx.fillStyle = 'rgba(228,240,252,0.9)'; fctx.fillRect(0, 0, W, H); // เริ่มด้วยกระจกเป็นฝ้า
    loop();
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    hands = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO", numHands: 1
    });
    $('#msg').textContent = 'ชูนิ้วชี้เพื่อเขียน • แบมือเพื่อเช็ด • เป่าใส่ไมค์เพื่อให้ฝ้ากลับมา';
    setTimeout(() => $('#msg').style.display = 'none', 6000);
  } catch (e) {
    $('#err').textContent = 'เริ่มไม่ได้: ' + e.message + ' (ลองเปิดด้วย Chrome และอนุญาตกล้อง/ไมค์)';
    console.error(e);
  }
};

addEventListener('keydown', e => { if (e.code === 'Space') { spaceDown = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });
const bb = $('#blowBtn');
bb.addEventListener('pointerdown', e => { spaceDown = true; bb.setPointerCapture(e.pointerId); });
['pointerup', 'pointercancel'].forEach(t => bb.addEventListener(t, () => { spaceDown = false; }));
$('#fogAll').onclick = () => { fctx.globalCompositeOperation = 'source-over'; fctx.fillStyle = 'rgba(228,240,252,0.9)'; fctx.fillRect(0, 0, W, H); };
$('#clear').onclick = () => { fctx.clearRect(0, 0, W, H); };
$('#snap').onclick = () => { const a = document.createElement('a'); a.download = 'foggy-glass.png'; a.href = view.toDataURL('image/png'); a.click(); };
</script>
</body>
</html>
